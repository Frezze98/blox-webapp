<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки Blox Fruits</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #1c1c1e; color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px 15px 80px 15px; user-select: none;
        }
        h2 { font-size: 16px; color: #a1a1aa; margin: 0 0 15px 0; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .screen { display: none; animation: fadeIn 0.2s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .menu-list { display: flex; flex-direction: column; gap: 10px; }
        .menu-item {
            background: #2c2c2e; padding: 16px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.1s;
        }
        .menu-item:active { transform: scale(0.97); background: #3a3a3c; }
        .menu-value { color: #8e8e93; font-size: 14px; font-weight: 400; text-align: right; max-width: 50%; }

        .grid-fruits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .fruit-card {
            position: relative; border-radius: 10px; height: 80px;
            display: flex; align-items: flex-end; justify-content: center; padding: 6px;
            background-size: cover; background-position: center; border: 2px solid transparent;
            cursor: pointer; overflow: hidden;
        }
        .fruit-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 70%); z-index: 1;
        }
        .fruit-card.selected { border-color: #0a84ff; transform: scale(0.95); }
        .fruit-card.selected::after { content: '✅'; position: absolute; top: 4px; right: 4px; z-index: 2; font-size: 12px; }
        .fruit-name { position: relative; z-index: 2; font-weight: 700; font-size: 12px; text-shadow: 1px 1px 2px black; text-align: center; }

        .opt-btn {
            background: #2c2c2e; padding: 15px 5px; border-radius: 10px;
            text-align: center; font-size: 15px; font-weight: 600; border: 2px solid transparent;
            cursor: pointer; transition: 0.1s;
        }
        .opt-btn.active { background: #0a84ff; color: white; border-color: #0a84ff; transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-main" class="screen active">
        <h2 id="t-main">⚙️ Настройки</h2>
        <div class="menu-list">
            <div class="menu-item" onclick="openScreen('screen-wishlist')">
                <span id="t-menu-w">🍎 Список желаемого</span>
                <span class="menu-value" id="val-wishlist">...</span>
            </div>
            <div class="menu-item" onclick="openScreen('screen-threshold')">
                <span id="t-menu-t">💰 Порог цены</span>
                <span class="menu-value" id="val-threshold">...</span>
            </div>
            <div class="menu-item" onclick="openScreen('screen-type')">
                <span id="t-menu-type">📦 Тип стока</span>
                <span class="menu-value" id="val-type">...</span>
            </div>
            <div class="menu-item" onclick="openScreen('screen-lang')">
                <span id="t-menu-lang">🌍 Язык</span>
                <span class="menu-value" id="val-lang">...</span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: СПИСОК ЖЕЛАЕМОГО -->
    <div id="screen-wishlist" class="screen">
        <h2 id="t-wishlist">Отметьте нужные фрукты</h2>
        <div class="grid-fruits" id="fruitsGrid"></div>
    </div>

    <!-- ЭКРАН 3: ПОРОГ ЦЕНЫ -->
    <div id="screen-threshold" class="screen">
        <h2 id="t-thresh">Выберите порог цены</h2>
        <div class="grid-options" id="thresholdGrid"></div>
    </div>

    <!-- ЭКРАН 4: ТИП СТОКА -->
    <div id="screen-type" class="screen">
        <h2 id="t-type">Выберите тип стока</h2>
        <div class="grid-options" id="typeGrid"></div>
    </div>

    <!-- ЭКРАН 5: ЯЗЫК -->
    <div id="screen-lang" class="screen">
        <h2 id="t-lang">Выберите язык</h2>
        <div class="grid-options" id="langGrid"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        let state = {
            wishlist: params.get('w') ? params.get('w').split(',') : [],
            threshold: parseInt(params.get('t') || '0'),
            type: params.get('type') || 'both',
            lang: params.get('lang') || 'ru'
        };

        // Словари переводов
        const dict = {
            ru: {
                main: "⚙️ Настройки", m_w: "🍎 Список желаемого", m_t: "💰 Порог цены", m_type: "📦 Тип стока", m_l: "🌍 Язык",
                h_w: "Отметьте нужные фрукты", h_t: "Выберите порог цены", h_type: "Выберите тип стока", h_l: "Выберите язык",
                selected: "Выбрано", none: "Ничего", save_close: "СОХРАНИТЬ И ЗАКРЫТЬ",
                t_all: "Все (0+)", type_both: "Оба стока", type_reg: "Обычный", type_mir: "Мираж"
            },
            en: {
                main: "⚙️ Settings", m_w: "🍎 Wishlist", m_t: "💰 Price Threshold", m_type: "📦 Stock Type", m_l: "🌍 Language",
                h_w: "Select desired fruits", h_t: "Select price threshold", h_type: "Select stock type", h_l: "Select language",
                selected: "Selected", none: "None", save_close: "SAVE & CLOSE",
                t_all: "All (0+)", type_both: "Both Stocks", type_reg: "Regular", type_mir: "Mirage"
            },
            uk: {
                main: "⚙️ Налаштування", m_w: "🍎 Список бажаного", m_t: "💰 Поріг ціни", m_type: "📦 Тип стоку", m_l: "🌍 Мова",
                h_w: "Відмітьте потрібні фрукти", h_t: "Оберіть поріг ціни", h_type: "Оберіть тип стоку", h_l: "Оберіть мову",
                selected: "Обрано", none: "Нічого", save_close: "ЗБЕРЕГТИ ТА ЗАКРИТИ",
                t_all: "Всі (0+)", type_both: "Обидва стоки", type_reg: "Звичайний", type_mir: "Міраж"
            }
        };

        function getLang() { return dict[state.lang] || dict['ru']; }

        // Применение перевода к заголовкам
        function applyTranslations() {
            const l = getLang();
            document.getElementById('t-main').innerText = l.main;
            document.getElementById('t-menu-w').innerText = l.m_w;
            document.getElementById('t-menu-t').innerText = l.m_t;
            document.getElementById('t-menu-type').innerText = l.m_type;
            document.getElementById('t-menu-lang').innerText = l.m_l;
            document.getElementById('t-wishlist').innerText = l.h_w;
            document.getElementById('t-thresh').innerText = l.h_t;
            document.getElementById('t-type').innerText = l.h_type;
            document.getElementById('t-lang').innerText = l.h_l;
        }

        const fruits = [
            { id: "Kitsune", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/0/07/Kitsune.png" },
            { id: "Dragon", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/3/30/Dragon.png" },
            { id: "Leopard", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/3/39/Leopard.png" },
            { id: "Dough", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/1/14/Dough.png" },
            { id: "T-Rex", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/b/b8/T-Rex.png" },
            { id: "Buddha", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/3/3b/Buddha.png" }
        ];

        function getThresholds() {
            const l = getLang();
            return [
                { val: 0, text: l.t_all }, { val: 1000000, text: "$1M" }, 
                { val: 2000000, text: "$2M" }, { val: 3000000, text: "$3M" }, 
                { val: 5000000, text: "$5M" }, { val: 10000000, text: "$10M" }
            ];
        }

        function getTypes() {
            const l = getLang();
            return [{ val: "both", text: l.type_both }, { val: "regular", text: l.type_reg }, { val: "mirage", text: l.type_mir }];
        }

        const langs = [{ val: "ru", text: "🇷🇺 Русский" }, { val: "uk", text: "🇺🇦 Українська" }, { val: "en", text: "🇺🇸 English" }];

        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'screen-main') {
                tg.BackButton.hide();
                tg.MainButton.setText(getLang().save_close);
                tg.MainButton.show();
                updateMainMenuLabels();
            } else {
                tg.BackButton.show();
                tg.MainButton.hide();
            }
        }

        tg.BackButton.onClick(() => { openScreen('screen-main'); });

        function updateMainMenuLabels() {
            const l = getLang();
            document.getElementById('val-wishlist').innerText = state.wishlist.length > 0 ? `${l.selected}: ${state.wishlist.length}` : l.none;
            let tObj = getThresholds().find(t => t.val === state.threshold);
            document.getElementById('val-threshold').innerText = tObj ? tObj.text : state.threshold;
            let typeObj = getTypes().find(t => t.val === state.type);
            document.getElementById('val-type').innerText = typeObj ? typeObj.text : state.type;
            let lObj = langs.find(lg => lg.val === state.lang);
            document.getElementById('val-lang').innerText = lObj ? lObj.text : state.lang;
        }

        const fGrid = document.getElementById("fruitsGrid");
        fruits.forEach(f => {
            let card = document.createElement("div");
            card.className = "fruit-card" + (state.wishlist.includes(f.id) ? " selected" : "");
            card.style.backgroundImage = `url('${f.image}')`;
            card.innerHTML = `<div class="fruit-name">${f.id}</div>`;
            card.onclick = () => {
                card.classList.toggle("selected");
                if (state.wishlist.includes(f.id)) state.wishlist = state.wishlist.filter(i => i !== f.id);
                else state.wishlist.push(f.id);
            };
            fGrid.appendChild(card);
        });

        function renderOptions(gridId, dataArray, stateKey) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            dataArray.forEach(item => {
                let btn = document.createElement("div");
                btn.className = "opt-btn" + (state[stateKey] === item.val ? " active" : "");
                btn.innerText = item.text;
                btn.onclick = () => {
                    state[stateKey] = item.val;
                    if (stateKey === 'lang') { applyTranslations(); } // Сразу переводим интерфейс при смене языка
                    renderOptions(gridId, dataArray, stateKey);
                    setTimeout(() => openScreen('screen-main'), 150);
                };
                grid.appendChild(btn);
            });
        }

        // Инициализация интерфейса
        applyTranslations();
        renderOptions("thresholdGrid", getThresholds(), "threshold");
        renderOptions("typeGrid", getTypes(), "type");
        renderOptions("langGrid", langs, "lang");
        openScreen('screen-main');

        tg.MainButton.onClick(() => {
            tg.sendData(JSON.stringify({ action: "save_all_settings", state: state }));
        });
    </script>
</body>
</html>
