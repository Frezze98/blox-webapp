<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist Фруктов</title>
    <!-- Обязательный скрипт для связи с Телеграмом -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #1c1c1e; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            user-select: none;
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 18px; color: #f2f2f7; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .fruit-card {
            background: #2c2c2e; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center;
            border: 2px solid transparent; 
            transition: all 0.2s ease-in-out; 
            cursor: pointer;
        }
        .fruit-card.selected { 
            border-color: #0a84ff; 
            background: #3a3a3c; 
            transform: scale(0.97);
        }
        .fruit-icon { font-size: 36px; margin-bottom: 8px; }
        .fruit-name { font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>
    <h2>Отметьте нужные фрукты:</h2>
    <div class="grid" id="fruitsGrid">
        <!-- Карточки сгенерирует JavaScript -->
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение почти на весь экран

        // Наш стартовый список фруктов (пока со смайликами, потом легко заменишь на <img src="... ">)
        const fruits = [
            { id: "Kitsune", icon: "🦊" },
            { id: "Dragon", icon: "🐉" },
            { id: "Leopard", icon: "🐆" },
            { id: "Dough", icon: "🍩" },
            { id: "T-Rex", icon: "🦖" },
            { id: "Buddha", icon: "🌕" }
        ];

        let selectedFruits = [];
        const grid = document.getElementById("fruitsGrid");

        // Отрисовка карточек
        fruits.forEach(f => {
            let card = document.createElement("div");
            card.className = "fruit-card";
            card.innerHTML = `<div class="fruit-icon">${f.icon}</div><div class="fruit-name">${f.id}</div>`;
            
            // Логика нажатия на карточку
            card.onclick = () => {
                card.classList.toggle("selected");
                if (selectedFruits.includes(f.id)) {
                    selectedFruits = selectedFruits.filter(item => item !== f.id);
                } else {
                    selectedFruits.push(f.id);
                }
                
                // Управление главной кнопкой внизу экрана
                if (selectedFruits.length > 0) {
                    tg.MainButton.setText(`СОХРАНИТЬ (${selectedFruits.length})`);
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            };
            grid.appendChild(card);
        });

        // Отправка данных обратно в бота при нажатии "Сохранить"
        tg.MainButton.onClick(() => {
            tg.sendData(JSON.stringify({ action: "save_fruits", list: selectedFruits }));
        });
    </script>
</body>
</html>
