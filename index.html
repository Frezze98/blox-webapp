<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist Фруктов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #1c1c1e; color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 15px 15px 80px 15px; user-select: none;
        }
        h2 { font-size: 16px; color: #a1a1aa; margin: 5px 0 15px 0; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Компактная сетка: 3 колонки */
        .grid-fruits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        .fruit-card {
            position: relative; border-radius: 10px; height: 80px;
            display: flex; align-items: flex-end; justify-content: center; padding: 6px;
            background-size: cover; background-position: center; border: 2px solid transparent;
            transition: 0.1s; cursor: pointer; overflow: hidden;
        }
        .fruit-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 70%); z-index: 1;
        }
        .fruit-card.selected { border-color: #0a84ff; transform: scale(0.95); }
        .fruit-card.selected::after { content: '✅'; position: absolute; top: 4px; right: 4px; z-index: 2; font-size: 12px; }
        .fruit-name { position: relative; z-index: 2; font-weight: 700; font-size: 12px; text-shadow: 1px 1px 2px black; text-align: center; }
    </style>
</head>
<body>

    <h2>🍎 Отметьте нужные фрукты</h2>
    <div class="grid-fruits" id="fruitsGrid"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        let wishlist = params.get('w') ? params.get('w').split(',') : [];

        const fruits = [
            { id: "Kitsune", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/0/07/Kitsune.png" },
            { id: "Dragon", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/3/30/Dragon.png" },
            { id: "Leopard", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/3/39/Leopard.png" },
            { id: "Dough", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/1/14/Dough.png" },
            { id: "T-Rex", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/b/b8/T-Rex.png" },
            { id: "Buddha", image: "https://static.wikia.nocookie.net/roblox-blox-pieces/images/3/3b/Buddha.png" }
        ];

        const fGrid = document.getElementById("fruitsGrid");
        fruits.forEach(f => {
            let card = document.createElement("div");
            card.className = "fruit-card" + (wishlist.includes(f.id) ? " selected" : "");
            card.style.backgroundImage = `url('${f.image}')`;
            card.innerHTML = `<div class="fruit-name">${f.id}</div>`;
            card.onclick = () => {
                card.classList.toggle("selected");
                if (wishlist.includes(f.id)) wishlist = wishlist.filter(i => i !== f.id);
                else wishlist.push(f.id);
                
                tg.MainButton.setText(`СОХРАНИТЬ (${wishlist.length})`);
                tg.MainButton.show();
            };
            fGrid.appendChild(card);
        });

        tg.MainButton.onClick(() => {
            tg.sendData(JSON.stringify({ action: "save_fruits", list: wishlist }));
        });
    </script>
</body>
</html>
